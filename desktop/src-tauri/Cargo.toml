[package]
name = "hzt-desktop"
version = "0.1.0"
description = "Hermes Zone Torba desktop shell — tray, native OS hooks, background daemon"
authors = ["Hermes Zone Torba Authors"]
edition = "2021"
rust-version = "1.77"

# See docs/adr/0003-tauri-over-electron.md for why Tauri was chosen over Electron.
[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "process"] }
# Cross-platform hardware/process sampling for the OS Monitor native collectors —
# see docs/08-os-monitor.md.
sysinfo = "0.39"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[[bin]]
name = "hzt-desktop"
path = "src/main.rs"
