name: Desktop CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "desktop/**"

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Rust checks
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings

      # `tauri build` (bundling an installer) additionally needs frontend/out, a static export of
      # the Next.js app. That export isn't wired up yet: frontend/next.config.ts currently builds
      # "standalone" for the Docker/Kubernetes web target, and reconciling the two frontend build
      # outputs is tracked for Phase 1 (see desktop/README.md#building-an-installer and
      # docs/18-roadmap.md). `cargo clippy` above already compiles every crate, so this is Phase
      # 0's real compile gate; re-add a `tauri build`/`tauri build --debug` step here once the
      # static export exists.
      - name: Verify Cargo package builds
        working-directory: desktop/src-tauri
        run: cargo build --locked
