apiVersion: apps/v1
kind: Deployment
metadata:
  name: hzt-web
  namespace: hermes-zone-torba
  labels:
    app.kubernetes.io/name: hzt-web
    app.kubernetes.io/part-of: hermes-zone-torba
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hzt-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hzt-web
    spec:
      containers:
        - name: web
          image: ghcr.io/ali-khamis45/hermes_zome_torba-web:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.hzt.example.com
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hzt-web
  namespace: hermes-zone-torba
  labels:
    app.kubernetes.io/name: hzt-web
spec:
  selector:
    app.kubernetes.io/name: hzt-web
  ports:
    - name: http
      port: 80
      targetPort: http
