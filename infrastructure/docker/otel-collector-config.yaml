# Local development OpenTelemetry Collector — receives OTLP from the API (see
# backend/src/Api/HermesZoneTorba.Api/Program.cs) and logs it to the console. Production
# deployments point `Otlp__Endpoint` at a real collector/backend (Grafana Tempo, Datadog, etc.)
# per docs/17-deployment.md#observability-in-production; this file is the dev-only default.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
